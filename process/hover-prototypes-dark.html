<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hover prototypes &middot; dark-mode variants</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
  html{background:#1A1A1A}
  body{font-family:'Geist',system-ui,sans-serif;background:#1A1A1A;color:#E8E8E8;-webkit-font-smoothing:antialiased;padding:40px 28px 140px}
  .shell{max-width:820px;margin:0 auto}
  h1{font-size:1.4rem;letter-spacing:-0.02em;margin-bottom:8px}
  p.lede{font-size:0.85rem;color:#9A9A9A;max-width:620px;line-height:1.6;margin-bottom:30px}
  .stage{width:392px;height:244px;border-radius:16px;overflow:hidden;border:1px solid #333;margin:26px 0 8px}
  .stage svg{width:100%;height:100%;display:block}
  .cap{font-size:0.72rem;color:#9A9A9A;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
  svg text{font-family:'Geist',system-ui,sans-serif}
  svg .mono{font-family:'SF Mono',Menlo,monospace}
  svg .badge{font-size:4.4px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
  .cursor{opacity:0}

  /* ===== PF dark — same 9s choreography as v4, PF navy family ===== */
  .pf .cursor{animation:pf-cursor 9s var(--ease-in-out) infinite}
  @keyframes pf-cursor{
    0%,8%{opacity:0;transform:translate(206px,30px)}
    18%{opacity:1;transform:translate(76px,66px)}
    24%{transform:translate(76px,66px)}
    26%{transform:translate(76px,66px) scale(.85)}
    28%{transform:translate(76px,66px) scale(1)}
    62%{opacity:1;transform:translate(76px,66px)}
    76%,100%{opacity:0;transform:translate(206px,96px)}
  }
  .pf .card2-bg{animation:pf-card2 9s ease infinite}
  @keyframes pf-card2{0%,25%{fill:#111b32;stroke:#223354}31%,86%{fill:#26365a;stroke:#35496f}94%,100%{fill:#111b32;stroke:#223354}}
  .pf .seg2{animation:pf-seg2 9s ease infinite}
  @keyframes pf-seg2{0%,25%{fill:#2e4d94}31%,86%{fill:#4d7dff}94%,100%{fill:#2e4d94}}
  .pf .playhead{animation:pf-head 9s var(--ease-out) infinite}
  @keyframes pf-head{0%,26%{transform:translateX(0)}36%,88%{transform:translateX(41px)}98%,100%{transform:translateX(0)}}
  .pf .red-body{transform-box:fill-box;transform-origin:0 50%;animation:pf-redbody 9s var(--ease-out) infinite}
  @keyframes pf-redbody{0%,26%{transform:scaleX(1)}36%,88%{transform:scaleX(5.1)}98%,100%{transform:scaleX(1)}}
  .pf .red-cap{animation:pf-redcap 9s var(--ease-out) infinite}
  @keyframes pf-redcap{0%,26%{transform:translateX(0)}36%,88%{transform:translateX(41px)}98%,100%{transform:translateX(0)}}

  /* ===== XC dark — same 10s choreography as v5, Xcode dark family ===== */
  .xc .cursor{animation:xc-cursor 10s var(--ease-in-out) infinite}
  @keyframes xc-cursor{
    0%,5%{opacity:0;transform:translate(206px,20px)}
    12%{opacity:1;transform:translate(98px,50px)}
    14.5%{transform:translate(98px,50px)}
    15%{transform:translate(98px,50px) scale(.85)}
    16%{transform:translate(98px,50px) scale(1)}
    26%{opacity:1;transform:translate(98px,50px)}
    30%{opacity:1;transform:translate(158px,11px)}
    30.5%{transform:translate(158px,11px)}
    31%{transform:translate(158px,11px) scale(.85)}
    32%{transform:translate(158px,11px) scale(1)}
    44%{opacity:1;transform:translate(158px,11px)}
    48%{opacity:1;transform:translate(158px,24px)}
    48.5%{transform:translate(158px,24px)}
    49%{transform:translate(158px,24px) scale(.85)}
    50%{transform:translate(158px,24px) scale(1)}
    72%{opacity:1;transform:translate(158px,24px)}
    84%,100%{opacity:0;transform:translate(206px,90px)}
  }
  .xc .git-row{animation:xc-git 10s ease infinite}
  @keyframes xc-git{0%,14.5%{fill:#3a3a41}15.5%,90%{fill:#1c1c20}96%,100%{fill:#3a3a41}}
  .xc .git-label{animation:xc-gitlbl 10s ease infinite}
  @keyframes xc-gitlbl{0%,14.5%{font-weight:600}15.5%,90%{font-weight:400}96%,100%{font-weight:600}}
  .xc .tree-row{animation:xc-tree 10s ease infinite}
  @keyframes xc-tree{0%,14.5%{fill:#1c1c20}15.5%,30.5%{fill:#3478f6}31.5%,90%{fill:#3a3a41}96%,100%{fill:#1c1c20}}
  .xc .tree-label{animation:xc-treelbl 10s ease infinite}
  @keyframes xc-treelbl{0%,14.5%{fill:#e2e2e8;font-weight:400}15.5%,30.5%{fill:#ffffff;font-weight:600}31.5%,90%{fill:#e2e2e8;font-weight:600}96%,100%{fill:#e2e2e8;font-weight:400}}
  .xc .tree-chev{animation:xc-treechev 10s ease infinite}
  @keyframes xc-treechev{0%,14.5%{opacity:0}15.5%,90%{opacity:1}96%,100%{opacity:0}}
  .xc .col3-row{opacity:0;animation:xc-col3 10s var(--ease-out) infinite}
  .xc .col3-row.r1{animation-delay:.06s}.xc .col3-row.r2{animation-delay:.14s}.xc .col3-row.r3{animation-delay:.22s}
  @keyframes xc-col3{0%,15.5%{opacity:0;transform:translateX(-7px)}21%,92%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(-7px)}}
  .xc .loc-row{animation:xc-loc 10s ease infinite}
  @keyframes xc-loc{0%,30.5%{fill:#1c1c20}31.5%,48.5%{fill:#3478f6}49.5%,100%{fill:#1c1c20}}
  .xc .loc-label{animation:xc-loclbl 10s ease infinite}
  @keyframes xc-loclbl{0%,30.5%{fill:#e2e2e8;font-weight:400}31.5%,48.5%{fill:#ffffff;font-weight:600}49.5%,100%{fill:#e2e2e8;font-weight:400}}
  .xc .con-row{animation:xc-con 10s ease infinite}
  @keyframes xc-con{0%,48.5%{fill:#1c1c20}49.5%,90%{fill:#3478f6}96%,100%{fill:#1c1c20}}
  .xc .con-label{animation:xc-conlbl 10s ease infinite}
  @keyframes xc-conlbl{0%,48.5%{fill:#e2e2e8;font-weight:400}49.5%,90%{fill:#ffffff;font-weight:600}96%,100%{fill:#e2e2e8;font-weight:400}}
  .xc .codeA{animation:xc-codeA 10s ease infinite}
  @keyframes xc-codeA{0%,15%{opacity:1}18%,96%{opacity:0}100%{opacity:1}}
  .xc .codeB{animation:xc-codeB 10s ease infinite}
  @keyframes xc-codeB{0%,15%{opacity:0}18%,92%{opacity:1}97%,100%{opacity:0}}
  .xc .hl-band{animation:xc-band 10s var(--ease-out) infinite}
  @keyframes xc-band{0%,31%{opacity:0;transform:translateY(0)}34%,48.5%{opacity:1;transform:translateY(0)}52%,90%{opacity:1;transform:translateY(21px)}96%,100%{opacity:0;transform:translateY(0)}}
  .xc .tok-loc{animation:xc-tokloc 10s ease infinite}
  @keyframes xc-tokloc{0%,31%{opacity:0}34%,48.5%{opacity:1}50%,100%{opacity:0}}
  .xc .tok-con{animation:xc-tokcon 10s ease infinite}
  @keyframes xc-tokcon{0%,49.5%{opacity:0}52%,90%{opacity:1}96%,100%{opacity:0}}

  /* ===== TR dark — same 10s choreography as v3, Trails dark family ===== */
  .tr .cursor{animation:tr-cursor 10s var(--ease-in-out) infinite}
  @keyframes tr-cursor{
    0%,6%{opacity:0;transform:translate(206px,26px)}
    14%{opacity:1;transform:translate(95px,52px)}
    17.5%{transform:translate(95px,52px)}
    18%{transform:translate(95px,52px) scale(.85)}
    19%{transform:translate(95px,52px) scale(1)}
    40%{opacity:1;transform:translate(95px,52px)}
    46%{opacity:1;transform:translate(95px,37px)}
    47.5%{transform:translate(95px,37px)}
    48%{transform:translate(95px,37px) scale(.85)}
    49%{transform:translate(95px,37px) scale(1)}
    74%{opacity:1;transform:translate(95px,37px)}
    86%,100%{opacity:0;transform:translate(206px,96px)}
  }
  .tr .red-on{animation:tr-redon 10s ease infinite}
  @keyframes tr-redon{0%,17.5%{opacity:0}20.5%,47.5%{opacity:1}50%,100%{opacity:0}}
  .tr .tick-red{transform-box:fill-box;transform-origin:center;animation:tr-tickred 10s var(--ease-out) infinite}
  @keyframes tr-tickred{0%,17.5%{transform:scale(1)}19.5%,47.5%{transform:scale(1.45)}50%,100%{transform:scale(1)}}
  .tr .green-on{animation:tr-greenon 10s ease infinite}
  @keyframes tr-greenon{0%,47.5%{opacity:0}50.5%,88%{opacity:1}95%,100%{opacity:0}}
  .tr .tick-green{transform-box:fill-box;transform-origin:center;animation:tr-tickgreen 10s var(--ease-out) infinite}
  @keyframes tr-tickgreen{0%,47.5%{transform:scale(1)}49.5%,88%{transform:scale(1.45)}95%,100%{transform:scale(1)}}

  @media (prefers-reduced-motion:reduce){svg *{animation-duration:0.01s !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="shell">
  <h1>Dark-mode hover clips</h1>
  <p class="lede">Same three locked prototypes, recolored into each project&rsquo;s dark thumbnail family so hovering in dark mode never flashes white. Choreography is untouched.</p>

  <p class="cap">Prompted Find &middot; dark</p>

        <text x="12" y="22">0:00</text>

        <g><rect x="114" y="56" width="44" height="24" rx="6" fill="#111b32" stroke="#223354" stroke-width=".8"/><text x="119" y="66" fill="#dfe4f0" font-weight="600">Deployab&#8230;</text><text x="119" y="75" fill="#7d8cb0" font-size="5.2">24:00-29:30</text></g>

  <p class="cap">Xcode Symbol Browser &middot; dark</p>
  <div class="stage" data-proto="xc"></div>
  <template id="xc">

        <g><rect x="6" y="21.3" width="6.4" height="6.4" rx="1.6" fill="#6e7681"/><text class="badge" x="9.2" y="24.5">A</text><text x="16" y="26.5" fill="#e2e2e8" font-weight="600">SourceControl</text><path d="M60 22.5 l2.4 2 -2.4 2" stroke="#9a9aa4" fill="none" stroke-width="1"/></g>
        <g><rect x="6" y="34.3" width="6.4" height="6.4" rx="1.6" fill="#6e7681"/><text class="badge" x="9.2" y="37.5">A</text><text x="16" y="39.5" fill="#e2e2e8">SPMBuildCore</text><path d="M60 35.5 l2.4 2 -2.4 2" stroke="#6a6a72" fill="none" stroke-width="1"/></g>
        <g><rect x="6" y="47.3" width="6.4" height="6.4" rx="1.6" fill="#6e7681"/><text class="badge" x="9.2" y="50.5">A</text><text x="16" y="52.5" fill="#e2e2e8">SPMBuild</text><path d="M60 48.5 l2.4 2 -2.4 2" stroke="#6a6a72" fill="none" stroke-width="1"/></g>
        <g><rect x="6" y="60.3" width="6.4" height="6.4" rx="1.6" fill="#6e7681"/><text class="badge" x="9.2" y="63.5">A</text><text x="16" y="65.5" fill="#e2e2e8">SMPSQLite3</text><path d="M60 61.5 l2.4 2 -2.4 2" stroke="#6a6a72" fill="none" stroke-width="1"/></g>
      </g>
      <g font-size="6">

        <g><rect x="72" y="8.3" width="6.4" height="6.4" rx="1.6" fill="#7f6fe8"/><text class="badge" x="75.2" y="11.5">C</text><text class="git-label" x="82" y="13.5" fill="#e2e2e8" font-weight="600">GitRepository</text><path d="M124 9.5 l2.4 2 -2.4 2" stroke="#9a9aa4" fill="none" stroke-width="1"/></g>
        <g><rect x="72" y="21.3" width="6.4" height="6.4" rx="1.6" fill="#e86fb0"/><text class="badge" x="75.2" y="24.5">S</text><text x="82" y="26.5" fill="#e2e2e8">Hash</text></g>

        <g><rect x="72" y="60.3" width="6.4" height="6.4" rx="1.6" fill="#e86fb0"/><text class="badge" x="75.2" y="63.5">S</text><text x="82" y="65.5" fill="#e2e2e8">Entry</text></g>
      </g>
      <g font-size="6">
        <g class="col3-row r1"><rect class="loc-row" x="135" y="6" width="58" height="11" rx="3" fill="#1c1c20"/><rect x="138" y="8.3" width="6.4" height="6.4" rx="1.6" fill="#5aa348"/><text class="badge" x="141.2" y="11.5">P</text><text class="loc-label" x="148" y="13.5" fill="#e2e2e8">location</text></g>

  <p class="cap">Trails &middot; dark</p>
  <div class="stage" data-proto="tr"></div>
  <template id="tr">
    <svg viewBox="0 0 196 122" xmlns="http://www.w3.org/2000/svg" class="tr">
      <rect width="196" height="122" fill="#0f0f13"/>
      <rect x="8" y="8" width="76" height="106" rx="5" fill="#16161b" stroke="#2a2a31" stroke-width=".8"/>
      <rect x="14" y="16" width="44" height="3.6" rx="1.8" fill="#9a9aa4"/>
      <g fill="#33333c">
        <rect x="14" y="26" width="62" height="2.4" rx="1.2"/>
        <rect x="14" y="31.5" width="56" height="2.4" rx="1.2"/>
        <rect x="14" y="37" width="62" height="2.4" rx="1.2"/>
      </g>
      <g class="green-on" opacity="0"><rect x="11" y="44" width="70" height="14" rx="3" fill="#63b34e" opacity=".18"/></g>
      <g fill="#33333c">
        <rect x="14" y="47" width="60" height="2.4" rx="1.2"/>

      </g>
      <g class="red-on" opacity="0"><rect x="11" y="60" width="70" height="19" rx="3" fill="#e0524d" opacity=".18"/></g>
