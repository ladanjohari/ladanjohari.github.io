<title>Homepage strip picker</title>
<style>
  :root { --bg:#F7F6F3; --ink:#111; --mid:#6B6B6B; --rule:rgba(0,0,0,0.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1A1A1A; --ink:#E8E8E8; --mid:#9A9A9A; --rule:#333; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Geist","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1100px; margin:0 auto; padding:56px 28px 120px; }
  h1 { font-size:1.55rem; font-weight:650; letter-spacing:-0.02em; margin:0 0 8px; }
  h2 { font-size:0.74rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--mid); margin:48px 0 16px; padding-top:22px; border-top:1px solid var(--rule); }
  p.lede { color:var(--mid); font-size:0.94rem; line-height:1.55; margin:0 0 8px; max-width:620px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px; }
  figure { margin:0; }
  figure img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    border-radius:8px; border:1px solid var(--rule); background:#eee; }
  figcaption { font-family:ui-monospace,Menlo,monospace; font-size:0.72rem; color:var(--mid);
    margin-top:7px; word-break:break-all; }
</style>
</head>
