<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:360px; height:225px; overflow:hidden; background:#0b0c0e; }
  .term {
    position:absolute; left:18px; top:22px; width:324px; height:181px;
    background:#131519; border:1px solid #23262c; border-radius:14px; overflow:hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar { height:22px; background:#1a1d22; border-bottom:1px solid #23262c;
         display:flex; align-items:center; gap:6px; padding-left:12px; }
  .bar i { width:7px; height:7px; border-radius:50%; background:#3a3e46; display:block; }
  .body { padding:14px 16px; font-size:13px; line-height:1.9; }
  .dollar { color:#4d5560; }

  /* The command is revealed by widening its own box one character at a time.
     The caret is that box's right edge, so it travels with the typing. */
  .typed {
    display:inline-block; vertical-align:-3px; box-sizing:content-box;
    line-height:1.15;
    white-space:nowrap; overflow:hidden;
    color:#e6eaf0;
    width:0ch;
    border-right:7px solid #e6eaf0;
    animation: type 1.9s steps(20, end) 0.3s forwards,
               blink 1s steps(1, end) 2.2s infinite;
  }
  @keyframes type { from { width:0ch; } to { width:20ch; } }
  @keyframes blink { 0%,50% { border-right-color:#e6eaf0; } 50.01%,100% { border-right-color:transparent; } }

  .out { color:#5a6270; font-size:11px; line-height:1.85; opacity:0; }
  .ok  { color:#3f8f5e; }
  .fade { animation: fadein 0.35s ease-out forwards; }
  @keyframes fadein { to { opacity:1; } }
</style></head>
<body>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body">
      <div><span class="dollar">$</span> <span class="typed">npm&nbsp;i&nbsp;agent-indicator</span></div>
      <div class="out fade" id="o1" style="animation-delay:2.6s">added 1 package in 1s</div>
      <div class="out fade" id="o2" style="animation-delay:3.1s"><span class="ok">&bull;</span> StatusIndicator&nbsp;&nbsp;ApprovalGate</div>
      <div class="out fade" id="o3" style="animation-delay:3.4s">&nbsp;&nbsp;SessionStrip&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ActivityTrail</div>
    </div>
  </div>
<script>
  if (window.OUTPUT_MODE === false) {
    ['o1','o2','o3'].forEach(id => document.getElementById(id).remove());
  }
</script>
</body></html>
