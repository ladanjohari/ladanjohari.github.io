<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trails hover preview &middot; source animation</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-in-out:cubic-bezier(0.77,0,0.175,1);
    /* light palette */
    --page:#ffffff;
    --doc:#fdfdfe;
    --doc-edge:#e4e4e9;
    --title:#3a3a3e;
    --line:#c9c9cf;
    --spine:#f4f4f6;
    --stage-edge:#D4D3CF;
    --canvas:#F7F6F3;
    --green:#5aa348;
    --red:#e0524d;
    --blue:#4d94ff;
    --amber:#e8a13c;
    --tint:0.16;
    --beam:0.13;
    --thread:0.7;
  }
  html[data-theme="dark"]{
    --page:#0f0f13;
    --doc:#16161b;
    --doc-edge:#2a2a31;
    --title:#9a9aa4;
    --line:#33333c;
    --spine:#1c1c22;
    --stage-edge:#333;
    --canvas:#1A1A1A;
    --green:#63b34e;
    --tint:0.18;
    --beam:0.16;
    --thread:0.8;
  }
  html,body{background:var(--canvas)}
  body{display:flex;align-items:flex-start;justify-content:flex-start}
  .stage{width:392px;height:244px;border-radius:16px;overflow:hidden;
         border:1px solid var(--stage-edge);background:var(--page)}
  .stage svg{width:100%;height:100%;display:block}

  /* =========================================================
     The relation column, 10s.
     Two documents, a spine of coloured markers between them.
     Click red  -> the red pair lights and the beam pinches
                   through the RED marker.
     Click green -> the red relation clears, the green pair
                   lights and the beam pinches through the
                   GREEN marker.
     Cursor tip coords: green marker (95,37), red marker (95,52.5).
     ========================================================= */
  .tr .cursor{animation:tr-cursor 10s var(--ease-in-out) infinite}
  @keyframes tr-cursor{
    0%,6%{opacity:0;transform:translate(206px,26px)}
    14%{opacity:1;transform:translate(95px,52px)}
    17.5%{transform:translate(95px,52px)}
    18%{transform:translate(95px,52px) scale(.85)}
    19%{transform:translate(95px,52px) scale(1)}
    40%{opacity:1;transform:translate(95px,52px)}
    46%{opacity:1;transform:translate(95px,37px)}
    47.5%{transform:translate(95px,37px)}
    48%{transform:translate(95px,37px) scale(.85)}
    49%{transform:translate(95px,37px) scale(1)}
    74%{opacity:1;transform:translate(95px,37px)}
    86%,100%{opacity:0;transform:translate(206px,96px)}
  }
  /* red set: on at click 1 (18%), off at click 2 (48%) */
  .tr .red-on{animation:tr-redon 10s ease infinite}
  @keyframes tr-redon{0%,17.5%{opacity:0}20.5%,47.5%{opacity:1}50%,100%{opacity:0}}
  .tr .tick-red{transform-box:fill-box;transform-origin:center;animation:tr-tickred 10s var(--ease-out) infinite}
  @keyframes tr-tickred{0%,17.5%{transform:scale(1)}19.5%,47.5%{transform:scale(1.45)}50%,100%{transform:scale(1)}}
  /* green set: on at click 2 (48%), off at reset */
  .tr .green-on{animation:tr-greenon 10s ease infinite}
  @keyframes tr-greenon{0%,47.5%{opacity:0}50.5%,88%{opacity:1}95%,100%{opacity:0}}
  .tr .tick-green{transform-box:fill-box;transform-origin:center;animation:tr-tickgreen 10s var(--ease-out) infinite}
  @keyframes tr-tickgreen{0%,47.5%{transform:scale(1)}49.5%,88%{transform:scale(1.45)}95%,100%{transform:scale(1)}}

  @media (prefers-reduced-motion:reduce){
    svg *{animation-duration:0.01s !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 196 122" xmlns="http://www.w3.org/2000/svg" class="tr">
    <rect width="196" height="122" fill="var(--page)"/>

    <!-- left document -->
    <rect x="8" y="8" width="76" height="106" rx="5" fill="var(--doc)" stroke="var(--doc-edge)" stroke-width=".8"/>
    <rect x="14" y="16" width="44" height="3.6" rx="1.8" fill="var(--title)"/>
    <g fill="var(--line)">
      <rect x="14" y="26" width="62" height="2.4" rx="1.2"/>
      <rect x="14" y="31.5" width="56" height="2.4" rx="1.2"/>
      <rect x="14" y="37" width="62" height="2.4" rx="1.2"/>
    </g>
    <!-- left green passage (y 44-58) -->
    <g class="green-on" opacity="0"><rect x="11" y="44" width="70" height="14" rx="3" fill="var(--green)" opacity="var(--tint)"/></g>
    <g fill="var(--line)">
      <rect x="14" y="47" width="60" height="2.4" rx="1.2"/>
      <rect x="14" y="52.5" width="52" height="2.4" rx="1.2"/>
    </g>
    <!-- left red passage (y 60-79) -->
    <g class="red-on" opacity="0"><rect x="11" y="60" width="70" height="19" rx="3" fill="var(--red)" opacity="var(--tint)"/></g>
    <g fill="var(--line)">
      <rect x="14" y="63" width="62" height="2.4" rx="1.2"/>
      <rect x="14" y="68.5" width="58" height="2.4" rx="1.2"/>
      <rect x="14" y="74" width="62" height="2.4" rx="1.2"/>
    </g>
    <g fill="var(--line)">
      <rect x="14" y="84" width="56" height="2.4" rx="1.2"/>
      <rect x="14" y="89.5" width="62" height="2.4" rx="1.2"/>
      <rect x="14" y="95" width="48" height="2.4" rx="1.2"/>
      <rect x="14" y="103" width="58" height="2.4" rx="1.2"/>
    </g>

    <!-- right document -->
    <rect x="112" y="8" width="76" height="106" rx="5" fill="var(--doc)" stroke="var(--doc-edge)" stroke-width=".8"/>
    <rect x="118" y="16" width="40" height="3.6" rx="1.8" fill="var(--title)"/>
    <!-- right red passage (y 24-38) -->
    <g class="red-on" opacity="0"><rect x="115" y="24" width="70" height="14" rx="3" fill="var(--red)" opacity="var(--tint)"/></g>
    <g fill="var(--line)">
      <rect x="118" y="27" width="60" height="2.4" rx="1.2"/>
      <rect x="118" y="32.5" width="54" height="2.4" rx="1.2"/>
    </g>
    <g fill="var(--line)">
      <rect x="118" y="42" width="62" height="2.4" rx="1.2"/>
      <rect x="118" y="47.5" width="56" height="2.4" rx="1.2"/>
    </g>
    <!-- right green passage (y 54-68) -->
    <g class="green-on" opacity="0"><rect x="115" y="54" width="70" height="14" rx="3" fill="var(--green)" opacity="var(--tint)"/></g>
    <g fill="var(--line)">
      <rect x="118" y="57" width="58" height="2.4" rx="1.2"/>
      <rect x="118" y="62.5" width="62" height="2.4" rx="1.2"/>
    </g>
    <g fill="var(--line)">
      <rect x="118" y="72" width="60" height="2.4" rx="1.2"/>
      <rect x="118" y="77.5" width="52" height="2.4" rx="1.2"/>
      <rect x="118" y="85" width="62" height="2.4" rx="1.2"/>
      <rect x="118" y="90.5" width="56" height="2.4" rx="1.2"/>
      <rect x="118" y="98" width="58" height="2.4" rx="1.2"/>
    </g>

    <!-- =====================================================
         Relation beams. Each band pinches to the height of ITS
         OWN marker where it crosses the spine (x 90-100), so a
         relation can only ever appear to start at its own dot.
         Red marker occupies y 50-55, green marker y 35-39.
         ===================================================== -->
    <g class="red-on" opacity="0">
      <polygon points="81,60 90,50 100,50 115,24 115,38 100,55 90,55 81,79"
               fill="var(--red)" opacity="var(--beam)"/>
      <path d="M81 69.5 C 85 69, 87 54, 90 52.5 L 100 52.5 C 104 52.5, 110 32, 115 31"
            stroke="var(--red)" stroke-width="1.2" fill="none" opacity="var(--thread)"/>
    </g>
    <g class="green-on" opacity="0">
      <polygon points="81,44 90,35 100,35 115,54 115,68 100,39 90,39 81,58"
               fill="var(--green)" opacity="var(--beam)"/>
      <path d="M81 51 C 85 51, 87 38, 90 37 L 100 37 C 104 37, 110 60, 115 61"
            stroke="var(--green)" stroke-width="1.2" fill="none" opacity="var(--thread)"/>
    </g>

    <!-- spine with coloured markers, drawn over the beams -->
    <rect x="90" y="8" width="10" height="106" rx="5" fill="var(--spine)"/>
    <rect x="92" y="22" width="6" height="4" rx="2" fill="var(--blue)"/>
    <rect class="tick-green" x="92" y="35" width="6" height="4" rx="2" fill="var(--green)"/>
    <rect class="tick-red" x="92" y="50" width="6" height="5" rx="2" fill="var(--red)"/>
    <rect x="92" y="88" width="6" height="4" rx="2" fill="var(--amber)"/>

    <g class="cursor"><path d="M0 0 L0 11.2 L2.6 8.8 L4.6 13 L6.4 12.2 L4.4 8 L7.8 7.8 Z" fill="#fff" stroke="#111" stroke-width=".9"/></g>
  </svg>
</div>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
</body>
</html>
